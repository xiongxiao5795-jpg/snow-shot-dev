name: Quick annotation macOS release package

on:
  workflow_dispatch:
  push:
    branches: [codex/quick-annotation-package]
    paths:
      - .github/workflows/quick-annotation-macos-release.yml

permissions:
  contents: read

concurrency:
  group: quick-annotation-macos-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.tools/vcpkg-binary-cache
      SNOW_QT_STATIC_DIR: ${{ github.workspace }}/.tools/qt-static/lib/cmake/Qt6
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify runner and Metal toolchain
        run: |
          test "$(uname -m)" = arm64
          xcrun --find metal || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install build tools
        run: brew install cmake ninja pkgconf clang-format
      - name: Restore static dependency cache
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.tools/vcpkg-binary-cache
          key: quick-annotation-release-vcpkg-xcode27.2-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            quick-annotation-release-vcpkg-xcode27.2-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh') }}-
      - name: Provision static dependencies
        id: provision
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          for attempt in 1 2 3; do
            if scripts/bootstrap-macos.sh snow-shot-macos-arm64-release --skip-qt-validation; then exit 0; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
      - name: Save static dependency cache
        if: always() && !cancelled() && steps.provision.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.tools/vcpkg-binary-cache
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Build upstream static Qt
        run: scripts/build-static-qt.sh --arch arm64 --install-prefix "$GITHUB_WORKSPACE/.tools/qt-static" --parallel 3
      - name: Package app using upstream script
        run: scripts/package-snow-shot.sh snow-shot-macos-arm64-release --parallel 3
      - name: Check packages and signatures
        run: |
          shopt -s nullglob
          packages=(build/snow-shot-macos-arm64-release/*.dmg)
          [[ ${#packages[@]} -eq 2 ]]
          for package in "${packages[@]}"; do
            codesign --verify --strict "$package"
            shasum -a 256 "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: snow-shot-release-macos-arm64
          path: |
            build/snow-shot-macos-arm64-release/*.dmg
            build/snow-shot-macos-arm64-release/*.dmg.sha256
          if-no-files-found: error
