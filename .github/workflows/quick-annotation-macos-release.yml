name: Quick annotation macOS release package

on:
  workflow_dispatch:
  push:
    branches: [codex/quick-annotation-package]
    paths:
      - '**'
      - '!.github/workflows/quick-annotation-macos-release.yml'
      - '!.github/workflows/quick-annotation-release-cache-check.yml'
      - '!.github/workflows/quick-annotation-macos-diagnostic.yml'
      - '!.github/workflows/quick-annotation-macos.yml'
      - '!scripts/macos-release-cache.py'
      - '!scripts/test-macos-release-cache.py'
      - '!scripts/test-macos-release-incremental.sh'
      - '!scripts/test-macos-build-support.py'
      - '!scripts/package-snow-shot.sh'

permissions:
  contents: read

concurrency:
  group: quick-annotation-macos-incremental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.tools/vcpkg-binary-cache
      SNOW_QT_STATIC_DIR: ${{ github.workspace }}/.tools/qt-static/lib/cmake/Qt6
      SNOW_RUST_CARGO_TARGET_DIR: ${{ github.workspace }}/.tools/release-cargo
      CCACHE_DIR: ${{ github.workspace }}/.tools/release-ccache
      CCACHE_MAXSIZE: 1500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Verify requested source
        run: python3 scripts/macos-release-cache.py verify --expected "$GITHUB_SHA"
      - name: Verify runner and Metal toolchain
        run: |
          test "$(uname -m)" = arm64
          xcrun --find metal || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - name: Check static Qt build script on system Bash
        run: |
          python3 scripts/test-macos-build-support.py \
            MacOSBuildScripts.test_static_native_qt_keeps_normal_tool_detection \
            MacOSBuildScripts.test_static_x64_qt_uses_rosetta_tools_with_a_fresh_cache \
            MacOSBuildScripts.test_static_qt_builder_supports_command_line_tools_without_full_xcode
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install build tools
        run: brew install cmake ninja pkgconf clang-format ccache
      - name: Restore static dependency cache
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.tools/vcpkg-binary-cache
          key: quick-annotation-release-vcpkg-xcode27.2-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            quick-annotation-release-vcpkg-xcode27.2-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh') }}-
            quick-annotation-release-vcpkg-xcode27.2-${{ runner.arch }}-
      - name: Provision static dependencies
        id: provision
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          for attempt in 1 2 3; do
            if scripts/bootstrap-macos.sh snow-shot-macos-arm64-release --skip-qt-validation; then exit 0; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
      - name: Save static dependency cache
        if: always() && !cancelled() && steps.provision.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.tools/vcpkg-binary-cache
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Check minizip dependency closure
        run: |
          config=.tools/macos/installed/static/arm64-osx-snow-shot-static/share/minizip-ng/minizip-ng-config.cmake
          test -f "$config"
          if grep -Ei 'find_dependency\((LibLZMA|zstd|OpenSSL)' "$config"; then exit 1; fi
      - name: Restore static Qt cache
        id: static-qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.tools/qt-static
          key: quick-annotation-static-qt-xcode27.2-${{ runner.arch }}-${{ hashFiles('scripts/build-static-qt.sh', 'scripts/validate-static-qt.py', 'scripts/static-qt-features.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}
          restore-keys: |
            quick-annotation-static-qt-xcode27.2-${{ runner.arch }}-
      - name: Build upstream static Qt
        id: static-qt
        run: scripts/build-static-qt.sh --arch arm64 --install-prefix "$GITHUB_WORKSPACE/.tools/qt-static" --parallel 3
      - name: Save static Qt cache
        if: steps.static-qt.outcome == 'success' && steps.static-qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.tools/qt-static
          key: ${{ steps.static-qt-cache.outputs.cache-primary-key }}
      - name: Fetch Rust dependencies for offline license collection
        run: |
          ocr_toolchain=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' snow-crates/crates/simd-paddle-ocr-rs/rust-toolchain.toml)
          rustup run "$ocr_toolchain" cargo fetch --locked --manifest-path snow-crates/Cargo.toml
          cargo fetch --locked --manifest-path snow_rust_ffi/Cargo.toml
          cargo fetch --locked --manifest-path snow_shot/rust/snow-shot-mcp/Cargo.toml
      - name: Identify the compiler, SDK and build policy
        id: toolchain
        run: |
          ocr_toolchain=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' snow-crates/crates/simd-paddle-ocr-rs/rust-toolchain.toml)
          identity=$({ xcodebuild -version; xcrun clang --version; xcrun --sdk macosx --show-sdk-build-version; rustc -vV; rustup run "$ocr_toolchain" rustc -vV; ccache --version; shasum -a 256 CMakeLists.txt snow_shot/CMakeLists.txt cmake/RustStaticLibrary.cmake cmake/SnowSelectedText.cmake cmake/SnowShotMini.cmake scripts/macos-release-cache.py; } | shasum -a 256 | awk '{print $1}')
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Restore C++ compiler cache
        id: cpp-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: release-cpp-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh', 'scripts/build-static-qt.sh', 'scripts/static-qt-features.json', '.tools/qt-static/share/snow-apps/static-qt-build.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-cpp-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh', 'scripts/build-static-qt.sh', 'scripts/static-qt-features.json', '.tools/qt-static/share/snow-apps/static-qt-build.json') }}-
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SNOW_RUST_CARGO_TARGET_DIR }}
          key: release-rust-full-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh', 'snow-crates/**/Cargo.toml', 'snow-crates/**/Cargo.lock', 'snow_rust_ffi/Cargo.toml', 'snow_rust_ffi/Cargo.lock', 'snow_draw_engine_qt/**/Cargo.toml', 'snow_shot/rust/**/Cargo.toml', 'snow_shot/rust/**/Cargo.lock', 'snow-crates/crates/simd-paddle-ocr-rs/rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-rust-full-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh', 'snow-crates/**/Cargo.toml', 'snow-crates/**/Cargo.lock', 'snow_rust_ffi/Cargo.toml', 'snow_rust_ffi/Cargo.lock', 'snow_draw_engine_qt/**/Cargo.toml', 'snow_shot/rust/**/Cargo.toml', 'snow_shot/rust/**/Cargo.lock', 'snow-crates/crates/simd-paddle-ocr-rs/rust-toolchain.toml') }}-
      - name: Build current source with reusable intermediates
        id: compile
        run: |
          test ! -e build/snow-shot-macos-arm64-release/CMakeCache.txt
          test ! -e build/snow-shot-macos-arm64-release/build.ninja
          test ! -e build/snow-shot-macos-arm64-release/snow_shot
          test ! -e build/snow-shot-macos-arm64-release/snow_shot_mini
          python3 scripts/macos-release-cache.py prepare --expected "$GITHUB_SHA" \
            --cargo-dir "$SNOW_RUST_CARGO_TARGET_DIR"
          ccache --zero-stats
          scripts/build.sh snow-shot-macos-arm64-release --skip-bootstrap --target snow_shot --parallel 3 -- \
            -DSNOW_APPS_BUILD_SNOW_SHOT_MINI=OFF \
            -DSNOW_RUST_CARGO_TARGET_DIR="$SNOW_RUST_CARGO_TARGET_DIR" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          python3 scripts/macos-release-cache.py verify --expected "$GITHUB_SHA"
          python3 scripts/macos-release-cache.py record --expected "$GITHUB_SHA" --cargo-dir "$SNOW_RUST_CARGO_TARGET_DIR"
          ccache --show-stats
      - name: Save C++ compiler cache
        if: steps.compile.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cpp-cache.outputs.cache-primary-key }}
      - name: Check Rust cache size
        id: rust-cache-size
        run: |
          size_mb=$(du -sm "$SNOW_RUST_CARGO_TARGET_DIR" | awk '{print $1}')
          echo "Rust cache size: ${size_mb} MiB"
          if (( size_mb <= 8192 )); then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Rust cache exceeds 8 GiB and will not be saved.'
            echo 'save=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save Rust build cache
        if: steps.rust-cache-size.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SNOW_RUST_CARGO_TARGET_DIR }}
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Package the verified build
        run: |
          python3 scripts/macos-release-cache.py verify --expected "$GITHUB_SHA"
          scripts/package-snow-shot.sh snow-shot-macos-arm64-release --skip-build --full-only
          python3 scripts/macos-release-cache.py verify --expected "$GITHUB_SHA"
      - name: Check packages and signatures
        run: |
          shopt -s nullglob
          packages=(build/snow-shot-macos-arm64-release/*.dmg)
          [[ ${#packages[@]} -eq 1 ]]
          [[ "${packages[0]}" != *snow-shot-mini* ]]
          for package in "${packages[@]}"; do
            codesign --verify --strict "$package"
            stat -f 'Package size: %z bytes  %N' "$package"
            shasum -a 256 "$package"
          done
          printf 'source_commit=%s\n' "$GITHUB_SHA" > build/snow-shot-macos-arm64-release/source-receipt.txt
          shasum -a 256 "${packages[@]}" >> build/snow-shot-macos-arm64-release/source-receipt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: snow-shot-release-macos-arm64
          path: |
            build/snow-shot-macos-arm64-release/*.dmg
            build/snow-shot-macos-arm64-release/*.dmg.sha256
            build/snow-shot-macos-arm64-release/source-receipt.txt
          if-no-files-found: error
