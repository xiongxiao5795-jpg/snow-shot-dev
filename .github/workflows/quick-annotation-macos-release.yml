name: Quick annotation macOS release package

on:
  workflow_dispatch:
  push:
    branches: [codex/quick-annotation-package]
    paths:
      - '**'
      - '!.github/workflows/quick-annotation-macos-release.yml'
      - '!.github/workflows/quick-annotation-release-cache-check.yml'
      - '!.github/workflows/quick-annotation-macos-diagnostic.yml'
      - '!.github/workflows/quick-annotation-macos.yml'
      - '!.github/workflows/quick-annotation-republish-dmg.yml'
      - '!scripts/macos-release-cache.py'
      - '!scripts/test-macos-release-cache.py'
      - '!scripts/test-macos-release-incremental.sh'
      - '!scripts/test-macos-build-support.py'
      - '!scripts/package-snow-shot.sh'
      - '!docs/fork-quick-annotation.md'

permissions:
  contents: read
  actions: write  # Remove obsolete snapshots created by this workflow.

concurrency:
  group: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[skip release]') && format('quick-annotation-skipped-{0}', github.run_id) || format('quick-annotation-macos-incremental-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  package:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.tools/vcpkg-binary-cache
      SNOW_QT_STATIC_DIR: ${{ github.workspace }}/.tools/qt-static/lib/cmake/Qt6
      SNOW_RUST_CARGO_TARGET_DIR: ${{ github.workspace }}/.tools/release-cargo
      CCACHE_DIR: ${{ github.workspace }}/.tools/release-ccache
      SNOW_THINLTO_CACHE_DIR: ${{ github.workspace }}/.tools/release-thinlto
      CCACHE_MAXSIZE: 1500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Verify requested source
        run: python3 scripts/macos-release-cache.py verify --expected "$GITHUB_SHA"
      - name: Verify runner and Metal toolchain
        run: |
          test "$(uname -m)" = arm64
          xcrun --find metal || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - name: Check static Qt build script on system Bash
        run: |
          python3 scripts/test-macos-build-support.py \
            MacOSBuildScripts.test_static_native_qt_keeps_normal_tool_detection \
            MacOSBuildScripts.test_static_x64_qt_uses_rosetta_tools_with_a_fresh_cache \
            MacOSBuildScripts.test_static_qt_builder_supports_command_line_tools_without_full_xcode
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install build tools
        run: brew install cmake ninja pkgconf clang-format ccache
      - name: Restore static dependency cache
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.tools/vcpkg-binary-cache
          key: quick-annotation-release-vcpkg-v2-xcode27.2-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh') }}
          restore-keys: |
            quick-annotation-release-vcpkg-xcode27.2-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh') }}-
            quick-annotation-release-vcpkg-xcode27.2-${{ runner.arch }}-
      - name: Provision static dependencies
        id: provision
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          for attempt in 1 2 3; do
            if scripts/bootstrap-macos.sh snow-shot-macos-arm64-release --skip-qt-validation; then exit 0; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
      - name: Save static dependency cache
        if: steps.provision.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.tools/vcpkg-binary-cache
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Check minizip dependency closure
        run: |
          config=.tools/macos/installed/static/arm64-osx-snow-shot-static/share/minizip-ng/minizip-ng-config.cmake
          test -f "$config"
          if grep -Ei 'find_dependency\((LibLZMA|zstd|OpenSSL)' "$config"; then exit 1; fi
      - name: Restore static Qt cache
        id: static-qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.tools/qt-static
          key: quick-annotation-static-qt-xcode27.2-${{ runner.arch }}-${{ hashFiles('scripts/build-static-qt.sh', 'scripts/validate-static-qt.py', 'scripts/static-qt-features.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}
          restore-keys: |
            quick-annotation-static-qt-xcode27.2-${{ runner.arch }}-
      - name: Build upstream static Qt
        id: static-qt
        run: scripts/build-static-qt.sh --arch arm64 --install-prefix "$GITHUB_WORKSPACE/.tools/qt-static" --parallel 3
      - name: Save static Qt cache
        if: steps.static-qt.outcome == 'success' && steps.static-qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.tools/qt-static
          key: ${{ steps.static-qt-cache.outputs.cache-primary-key }}
      - name: Fetch Rust dependencies for offline license collection
        run: |
          ocr_toolchain=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' snow-crates/crates/simd-paddle-ocr-rs/rust-toolchain.toml)
          rustup run "$ocr_toolchain" cargo fetch --locked --manifest-path snow-crates/Cargo.toml
          cargo fetch --locked --manifest-path snow_rust_ffi/Cargo.toml
          cargo fetch --locked --manifest-path snow_shot/rust/snow-shot-mcp/Cargo.toml
      - name: Identify the compiler, SDK and build policy
        id: toolchain
        run: |
          ocr_toolchain=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' snow-crates/crates/simd-paddle-ocr-rs/rust-toolchain.toml)
          toolchain=$({ xcodebuild -version; xcrun clang --version; xcrun --sdk macosx --show-sdk-build-version; rustc -vV; rustup run "$ocr_toolchain" rustc -vV; ccache --version; } | shasum -a 256 | awk '{print $1}')
          # Bootstrap the new cache from the old exact policy once; never restore
          # a cache from a different compiler or dependency configuration.
          legacy=$({ xcodebuild -version; xcrun clang --version; xcrun --sdk macosx --show-sdk-build-version; rustc -vV; rustup run "$ocr_toolchain" rustc -vV; ccache --version; shasum -a 256 CMakeLists.txt snow_shot/CMakeLists.txt cmake/RustStaticLibrary.cmake cmake/SnowSelectedText.cmake cmake/SnowShotMini.cmake scripts/macos-release-cache.py; } | shasum -a 256 | awk '{print $1}')
          rust_sources=$(git ls-files --stage --recurse-submodules -- snow-crates snow_rust_ffi snow_draw_engine_qt/Cargo.toml snow_draw_engine_qt/Cargo.lock snow_draw_engine_qt/crates snow_shot/rust | shasum -a 256 | awk '{print $1}')
          echo "identity=$toolchain" >> "$GITHUB_OUTPUT"
          echo "legacy=$legacy" >> "$GITHUB_OUTPUT"
          echo "rust_sources=$rust_sources" >> "$GITHUB_OUTPUT"
      - name: Restore C++ compiler cache
        id: cpp-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: release-cpp-v2-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh', 'scripts/build-static-qt.sh', 'scripts/static-qt-features.json', '.tools/qt-static/share/snow-apps/static-qt-build.json') }}-${{ github.sha }}
          restore-keys: |
            release-cpp-v2-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh', 'scripts/build-static-qt.sh', 'scripts/static-qt-features.json', '.tools/qt-static/share/snow-apps/static-qt-build.json') }}-
            release-cpp-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.legacy }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh', 'scripts/build-static-qt.sh', 'scripts/static-qt-features.json', '.tools/qt-static/share/snow-apps/static-qt-build.json') }}-
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SNOW_RUST_CARGO_TARGET_DIR }}
          key: release-rust-full-v3-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh', 'snow-crates/**/Cargo.toml', 'snow-crates/**/Cargo.lock', 'snow_rust_ffi/Cargo.toml', 'snow_rust_ffi/Cargo.lock', 'snow_draw_engine_qt/**/Cargo.toml', 'snow_shot/rust/**/Cargo.toml', 'snow_shot/rust/**/Cargo.lock', 'snow-crates/crates/simd-paddle-ocr-rs/rust-toolchain.toml') }}-${{ steps.toolchain.outputs.rust_sources }}
          restore-keys: |
            release-rust-full-v3-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh', 'snow-crates/**/Cargo.toml', 'snow-crates/**/Cargo.lock', 'snow_rust_ffi/Cargo.toml', 'snow_rust_ffi/Cargo.lock', 'snow_draw_engine_qt/**/Cargo.toml', 'snow_shot/rust/**/Cargo.toml', 'snow_shot/rust/**/Cargo.lock', 'snow-crates/crates/simd-paddle-ocr-rs/rust-toolchain.toml') }}-
            release-rust-full-v2-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh', 'snow-crates/**/Cargo.toml', 'snow-crates/**/Cargo.lock', 'snow_rust_ffi/Cargo.toml', 'snow_rust_ffi/Cargo.lock', 'snow_draw_engine_qt/**/Cargo.toml', 'snow_shot/rust/**/Cargo.toml', 'snow_shot/rust/**/Cargo.lock', 'snow-crates/crates/simd-paddle-ocr-rs/rust-toolchain.toml') }}-
            release-rust-full-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.legacy }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh', 'snow-crates/**/Cargo.toml', 'snow-crates/**/Cargo.lock', 'snow_rust_ffi/Cargo.toml', 'snow_rust_ffi/Cargo.lock', 'snow_draw_engine_qt/**/Cargo.toml', 'snow_shot/rust/**/Cargo.toml', 'snow_shot/rust/**/Cargo.lock', 'snow-crates/crates/simd-paddle-ocr-rs/rust-toolchain.toml') }}-
      - name: Restore ThinLTO linker cache
        id: thinlto-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SNOW_THINLTO_CACHE_DIR }}
          key: release-thinlto-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh', 'scripts/build-static-qt.sh', 'scripts/static-qt-features.json', '.tools/qt-static/share/snow-apps/static-qt-build.json') }}-${{ github.sha }}
          restore-keys: |
            release-thinlto-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh', 'scripts/build-static-qt.sh', 'scripts/static-qt-features.json', '.tools/qt-static/share/snow-apps/static-qt-build.json') }}-
      - name: Build current source with reusable intermediates
        id: compile
        env:
          # Explain rebuilds without changing Cargo's fingerprint behavior.
          CARGO_LOG: cargo::core::compiler::fingerprint=info,cargo::compiler::fingerprint=info
        run: |
          test ! -e build/snow-shot-macos-arm64-release/CMakeCache.txt
          test ! -e build/snow-shot-macos-arm64-release/build.ninja
          test ! -e build/snow-shot-macos-arm64-release/snow_shot
          test ! -e build/snow-shot-macos-arm64-release/snow_shot_mini
          python3 scripts/macos-release-cache.py prepare --expected "$GITHUB_SHA" \
            --cargo-dir "$SNOW_RUST_CARGO_TARGET_DIR"
          mkdir -p "$SNOW_THINLTO_CACHE_DIR"
          ccache --zero-stats
          export SNOW_REAL_CARGO="$(command -v cargo)"
          cmake_options=(
            -DSNOW_APPS_BUILD_SNOW_SHOT_MINI=OFF
            -DSNOW_SHOT_ENABLE_QUICK_ANNOTATION=ON
            -DCMAKE_PROJECT_INCLUDE="$GITHUB_WORKSPACE/cmake/fork/QuickAnnotationCachedPrefix.cmake"
            -DSNOW_RUST_CARGO_TARGET_DIR="$SNOW_RUST_CARGO_TARGET_DIR"
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-cache_path_lto,$SNOW_THINLTO_CACHE_DIR"
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            "-DCMAKE_CXX_COMPILER_LAUNCHER=python3;$GITHUB_WORKSPACE/scripts/macos-ccache-prefix.py"
            "-DCMAKE_OBJCXX_COMPILER_LAUNCHER=python3;$GITHUB_WORKSPACE/scripts/macos-ccache-prefix.py"
            "-DCARGO_EXECUTABLE=$GITHUB_WORKSPACE/scripts/macos-cargo-cache.py"
          )
          # Ninja builds the OCR bridge before invoking Cargo. The fork Cargo
          # launcher restores verified input timestamps at that exact boundary,
          # after Ninja's dependency scan, so the bridge is not relinked again.
          scripts/build.sh snow-shot-macos-arm64-release --skip-bootstrap \
            --target snow_shot --parallel 3 -- "${cmake_options[@]}"
          python3 scripts/macos-release-cache.py verify --expected "$GITHUB_SHA"
          python3 scripts/macos-release-cache.py record --expected "$GITHUB_SHA" --cargo-dir "$SNOW_RUST_CARGO_TARGET_DIR"
          ccache --show-stats --verbose
          du -sm "$SNOW_THINLTO_CACHE_DIR"
      - name: Save C++ compiler cache
        if: steps.compile.outcome == 'success' && steps.cpp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cpp-cache.outputs.cache-primary-key }}
      - name: Check ThinLTO cache size
        id: thinlto-size
        run: |
          size_mb=$(du -sm "$SNOW_THINLTO_CACHE_DIR" | awk '{print $1}')
          echo "ThinLTO cache size: ${size_mb} MiB"
          if (( size_mb > 0 && size_mb <= 3072 )); then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::ThinLTO cache is empty or exceeds 3 GiB on disk; skipping save.'
            echo 'save=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save ThinLTO linker cache
        if: steps.thinlto-size.outputs.save == 'true' && steps.thinlto-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SNOW_THINLTO_CACHE_DIR }}
          key: ${{ steps.thinlto-cache.outputs.cache-primary-key }}
      - name: Check Rust cache size
        id: rust-cache-size
        run: |
          size_mb=$(du -sm "$SNOW_RUST_CARGO_TARGET_DIR" | awk '{print $1}')
          echo "Rust cache size: ${size_mb} MiB"
          # GitHub compresses the saved cache. Allow the observed Full build
          # (9,376 MiB on disk), while keeping a conservative size bound.
          if (( size_mb <= 9728 )); then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Rust cache exceeds 9.5 GiB on disk and will not be saved.'
            echo 'save=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save Rust build cache
        if: steps.rust-cache-size.outputs.save == 'true' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SNOW_RUST_CARGO_TARGET_DIR }}
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Package the verified build
        run: |
          python3 scripts/macos-release-cache.py verify --expected "$GITHUB_SHA"
          grep -Fx 'SNOW_SHOT_ENABLE_QUICK_ANNOTATION:BOOL=ON' build/snow-shot-macos-arm64-release/CMakeCache.txt
          scripts/package-snow-shot.sh snow-shot-macos-arm64-release --skip-build --full-only
          python3 scripts/macos-release-cache.py verify --expected "$GITHUB_SHA"
      - name: Check packages and signatures
        run: |
          shopt -s nullglob
          packages=(build/snow-shot-macos-arm64-release/*.dmg)
          [[ ${#packages[@]} -eq 1 ]]
          [[ "${packages[0]}" != *snow-shot-mini* ]]
          for package in "${packages[@]}"; do
            codesign --verify --strict "$package"
            stat -f 'Package size: %z bytes  %N' "$package"
            shasum -a 256 "$package"
          done
          printf 'source_commit=%s\n' "$GITHUB_SHA" > build/snow-shot-macos-arm64-release/source-receipt.txt
          shasum -a 256 "${packages[@]}" >> build/snow-shot-macos-arm64-release/source-receipt.txt
      - name: Upload DMG for direct download
        id: dmg
        uses: actions/upload-artifact@v7
        with:
          path: build/snow-shot-macos-arm64-release/*.dmg
          archive: false
          if-no-files-found: error
      - name: Upload DMG checksum
        uses: actions/upload-artifact@v7
        with:
          path: build/snow-shot-macos-arm64-release/*.dmg.sha256
          archive: false
          if-no-files-found: error
      - name: Upload persistent-identity installer
        uses: actions/upload-artifact@v7
        with:
          path: scripts/install-snow-shot-macos.sh
          archive: false
          if-no-files-found: error
      - name: Upload source receipt
        uses: actions/upload-artifact@v7
        with:
          path: build/snow-shot-macos-arm64-release/source-receipt.txt
          archive: false
          if-no-files-found: error
      - name: Link the DMG in the run summary
        env:
          DMG_URL: ${{ steps.dmg.outputs.artifact-url }}
        run: printf '[Download the macOS ARM64 DMG](%s)\n' "$DMG_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Prune superseded Rust snapshots
        if: steps.rust-cache-size.outputs.save == 'true' && steps.rust-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SAVED_KEY: ${{ steps.rust-cache.outputs.cache-primary-key }}
        run: |
          # Only remove old v3 snapshots on this branch after confirming the
          # new snapshot exists. Keep one previous snapshot as a fallback.
          snapshots=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --key release-rust-full-v3- --limit 100 --json id,key,createdAt)
          if ! printf '%s' "$snapshots" | jq -e --arg key "$SAVED_KEY" 'any(.[]; .key == $key)' >/dev/null; then
            echo 'New cache was not saved; retaining all previous snapshots.'
            exit 0
          fi
          printf '%s' "$snapshots" | jq -r --arg key "$SAVED_KEY" \
            '[.[] | select(.key != $key)] | sort_by(.createdAt) | reverse | .[1:] | .[].id' |
          while IFS= read -r cache_id; do
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
          done
      - name: Prune superseded ThinLTO snapshots
        if: steps.thinlto-size.outputs.save == 'true' && steps.thinlto-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SAVED_KEY: ${{ steps.thinlto-cache.outputs.cache-primary-key }}
        run: |
          snapshots=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --key release-thinlto-v1- --limit 100 --json id,key,createdAt)
          if ! printf '%s' "$snapshots" | jq -e --arg key "$SAVED_KEY" 'any(.[]; .key == $key)' >/dev/null; then
            echo 'New cache was not saved; retaining all previous snapshots.'
            exit 0
          fi
          printf '%s' "$snapshots" | jq -r --arg key "$SAVED_KEY" \
            '[.[] | select(.key != $key)] | sort_by(.createdAt) | reverse | .[1:] | .[].id' |
          while IFS= read -r cache_id; do
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
          done
      - name: Prune superseded C++ snapshots
        if: steps.compile.outcome == 'success' && steps.cpp-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SAVED_KEY: ${{ steps.cpp-cache.outputs.cache-primary-key }}
        run: |
          snapshots=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --key release-cpp-v2- --limit 100 --json id,key,createdAt)
          if ! printf '%s' "$snapshots" | jq -e --arg key "$SAVED_KEY" 'any(.[]; .key == $key)' >/dev/null; then
            echo 'New cache was not saved; retaining all previous snapshots.'
            exit 0
          fi
          printf '%s' "$snapshots" | jq -r --arg key "$SAVED_KEY" \
            '[.[] | select(.key != $key)] | sort_by(.createdAt) | reverse | .[1:] | .[].id' |
          while IFS= read -r cache_id; do
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
          done
