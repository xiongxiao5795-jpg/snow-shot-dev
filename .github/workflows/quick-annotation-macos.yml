name: Quick annotation macOS verification

on:
  workflow_dispatch:
  push:
    branches: [codex/quick-annotation-package]
    paths-ignore:
      - '.github/workflows/quick-annotation-macos.yml'
      - '.github/workflows/quick-annotation-macos-release.yml'
      - '.github/workflows/quick-annotation-macos-diagnostic.yml'
      - '.github/workflows/quick-annotation-release-cache-check.yml'
      - '.github/workflows/quick-annotation-republish-dmg.yml'
      - 'scripts/package-snow-shot.sh'
      - 'scripts/macos-release-cache.py'
      - 'scripts/test-macos-build-support.py'
      - 'scripts/test-macos-release-cache.py'
      - 'scripts/test-macos-release-incremental.sh'
      - 'docs/fork-quick-annotation.md'

permissions:
  contents: read

concurrency:
  group: quick-annotation-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip debug]') }}
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.tools/vcpkg-binary-cache
      CCACHE_DIR: ${{ github.workspace }}/.tools/ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64
      - name: Verify Metal toolchain
        run: |
          xcrun --find metal || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.12.0
          host: mac
          target: desktop
          arch: clang_64
          cache: true
      - name: Install build tools
        run: brew install cmake ninja pkgconf clang-format ccache
      - name: Configure Qt location
        run: |
          echo "Qt6_DIR=$QT_ROOT_DIR/lib/cmake/Qt6" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$GITHUB_WORKSPACE/.tools/macos/installed/dynamic/arm64-osx-snow-shot/lib/pkgconfig:$GITHUB_WORKSPACE/.tools/macos/installed/dynamic/arm64-osx-snow-shot/share/pkgconfig" >> "$GITHUB_ENV"
      - name: Restore dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.tools/vcpkg-binary-cache
          key: quick-annotation-vcpkg-xcode27.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            quick-annotation-vcpkg-xcode27.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh') }}-
            quick-annotation-vcpkg-xcode27.2-${{ runner.os }}-${{ runner.arch }}-
      - name: Provision dependencies
        id: provision
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          for attempt in 1 2 3; do
            if scripts/bootstrap-macos.sh snow-shot-macos-arm64-debug; then exit 0; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
      - name: Save dependency cache
        if: always() && !cancelled() && steps.provision.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.tools/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Check minizip dependency closure
        run: |
          config=.tools/macos/installed/dynamic/arm64-osx-snow-shot/share/minizip-ng/minizip-ng-config.cmake
          test -f "$config"
          if grep -Ei 'find_dependency\((LibLZMA|zstd|OpenSSL)' "$config"; then exit 1; fi
      - name: Extract and check translations
        run: |
          scripts/build.sh snow-shot-macos-arm64-debug --target snow_shot_update_translations --parallel 3 -- -DSNOW_APPS_BUILD_SNOW_SHOT_MINI=OFF -DSNOW_MACOS_CODESIGN_IDENTITY=- -DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew -DCMAKE_MAKE_PROGRAM=/opt/homebrew/bin/ninja -DPKG_CONFIG_EXECUTABLE=/opt/homebrew/bin/pkg-config
          python3 snow_shot/scripts/translation_catalogs.py check
          git diff --exit-code -- snow_shot/i18n
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.tools/ccache
          key: quick-annotation-ccache-xcode27.2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            quick-annotation-ccache-xcode27.2-${{ runner.os }}-${{ runner.arch }}-
      - name: Save extracted catalogs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-extracted-catalogs
          path: snow_shot/i18n
      - name: Build app and targeted tests
        id: compile
        run: |
          scripts/build.sh snow-shot-macos-arm64-debug --target snow_shot --target snow-shot-quick-annotation-state-tests --target snow-shot-quick-annotation-options-tests --target snow-shot-global-canvas-tests --target snow-shot-global-shortcut-manager-tests --target snow-shot-app-permissions-tests --target snow-shot-quick-annotation-settings-tests --target snow-shot-settings-catalog-tests --target snow-shot-configuration-schema-tests --target snow-shot-diagnostics-export-tests --parallel 3 -- -DSNOW_APPS_BUILD_SNOW_SHOT_MINI=OFF -DSNOW_MACOS_CODESIGN_IDENTITY=- -DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew -DCMAKE_MAKE_PROGRAM=/opt/homebrew/bin/ninja -DPKG_CONFIG_EXECUTABLE=/opt/homebrew/bin/pkg-config -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          if otool -L build/snow-shot-macos-arm64-debug/snow_shot/snow_shot.app/Contents/MacOS/snow_shot | grep -F /opt/homebrew/; then
            echo 'The app unexpectedly links a Homebrew library.' >&2
            exit 1
          fi
      - name: Save compiler cache
        if: always() && !cancelled() && steps.compile.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.tools/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Run targeted tests
        run: |
          ctest --preset test-snow-shot-macos-arm64-debug --output-on-failure -R '^snow-shot-(quick-annotation|quick-annotation-state|quick-annotation-options|quick-annotation-settings|global-canvas-platform|global-shortcut-manager|app-permissions|settings-catalog|configuration-schema|diagnostics-export)-tests$'
      - name: Run native canvas checks
        id: native-checks
        continue-on-error: true
        run: |
          ctest --test-dir build/snow-shot-macos-arm64-debug --output-on-failure -R '^snow-shot-global-canvas-native-tests$'
      - name: Fetch Rust dependencies for offline license collection
        run: |
          ocr_toolchain=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' snow-crates/crates/simd-paddle-ocr-rs/rust-toolchain.toml)
          rustup run "$ocr_toolchain" cargo fetch --locked --manifest-path snow-crates/Cargo.toml
          cargo fetch --locked --manifest-path snow_rust_ffi/Cargo.toml
          cargo fetch --locked --manifest-path snow_shot/rust/snow-shot-mcp/Cargo.toml
      - name: Deploy development app
        run: |
          cmake --install build/snow-shot-macos-arm64-debug --component SnowShot --prefix "$RUNNER_TEMP/snow-shot"
          "$RUNNER_TEMP/snow-shot/snow_shot.app/Contents/MacOS/snow_shot" --startup-probe
      - name: Require native canvas checks to pass
        if: steps.native-checks.outcome == 'failure'
        run: exit 1
