name: Quick annotation macOS verification

on:
  workflow_dispatch:
  push:
    branches: [feat/quick-annotation]

permissions:
  contents: read

concurrency:
  group: quick-annotation-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.tools/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.12.0
          host: mac
          target: desktop
          arch: clang_64
          cache: true
      - name: Install build tools
        run: brew install cmake ninja pkgconf
      - name: Configure Qt location
        run: echo "Qt6_DIR=$QT_ROOT_DIR/lib/cmake/Qt6" >> "$GITHUB_ENV"
      - name: Restore dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.tools/vcpkg-binary-cache
          key: quick-annotation-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'scripts/bootstrap-macos.sh') }}
      - name: Provision dependencies
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          scripts/bootstrap-macos.sh snow-shot-macos-arm64-debug
      - name: Save dependency cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.tools/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Extract and check translations
        run: |
          scripts/build.sh snow-shot-macos-arm64-debug --target snow_shot_update_translations --parallel 3 -- -DSNOW_MACOS_CODESIGN_IDENTITY=-
          python3 snow_shot/scripts/translation_catalogs.py check
          git diff --exit-code -- snow_shot/i18n
      - name: Save extracted catalogs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-extracted-catalogs
          path: snow_shot/i18n
      - name: Build app and targeted tests
        run: |
          scripts/build.sh snow-shot-macos-arm64-debug --target snow_shot --target snow-shot-quick-annotation-state-tests --target snow-shot-global-canvas-tests --target snow-shot-global-shortcut-manager-tests --target snow-shot-app-permissions-tests --target snow-shot-settings-catalog-tests --parallel 3 -- -DSNOW_MACOS_CODESIGN_IDENTITY=-
      - name: Run targeted tests
        run: |
          ctest --preset test-snow-shot-macos-arm64-debug --output-on-failure -R '^snow-shot-(quick-annotation|quick-annotation-state|global-canvas-platform|global-shortcut-manager|app-permissions|settings-catalog)-tests$'
      - name: Deploy development app
        run: |
          cmake --install build/snow-shot-macos-arm64-debug --component SnowShot --prefix "$RUNNER_TEMP/snow-shot"
          "$RUNNER_TEMP/snow-shot/snow_shot.app/Contents/MacOS/snow_shot" --startup-probe
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/snow-shot/snow_shot.app" "$RUNNER_TEMP/snow-shot-debug-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: snow-shot-debug-macos-arm64
          path: ${{ runner.temp }}/snow-shot-debug-macos-arm64.zip
          if-no-files-found: error
