name: Inspect release 5 package sizes
on:
  push:
    branches: [codex/release-incremental]
    paths: ['.github/workflows/inspect-release-5.yml']
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release 5 artifact to GitHub runner
        uses: actions/download-artifact@v4
        with:
          name: snow-shot-release-macos-arm64
          run-id: 42821746714
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-5
      - name: Compare DMG sizes with upstream 1.5.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/mg-chao/snow-shot/releases/tags/v1.5.3_snow-shot' > "$RUNNER_TEMP/upstream-release.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          release = json.loads((root / 'upstream-release.json').read_text())
          assets = {asset['name']: asset['size'] for asset in release['assets']}
          names = ['snow-shot-1.5.3-macos-arm64.dmg', 'snow-shot-mini-1.5.3-macos-arm64.dmg']
          print('file | #5 bytes | upstream bytes | delta bytes')
          for name in names:
              ours = (root / 'release-5' / name).stat().st_size
              upstream = assets[name]
              print(f'{name} | {ours} | {upstream} | {ours - upstream:+d}')
          PY
